<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spillway deployment demo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101c2b; color: #f4f8ff; font: 18px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; padding: 48px; border: 1px solid #46647e; border-radius: 24px; background: #1a3046; box-shadow: 0 24px 70px #07111e; }
    .tag { color: #71e1c0; font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 16px 0; font-size: clamp(32px, 6vw, 56px); line-height: 1.08; }
    p { color: #c7d9e9; }
    code { color: #71e1c0; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Spillway · one action deployment</div>
    <h1>배포 완료.</h1>
    <p>이 페이지는 로컬 소스 <code>examples/hello</code>에서 빌드되어 실행 중입니다. 같은 소스를 Docker 또는 Cloud Run 대상으로 배포할 수 있습니다.</p>
    <p>앱 상태: <code>/healthz</code></p>
  </main>
</body>
</html>
