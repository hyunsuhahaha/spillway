# Spillway single-machine simulation.
#
# Two "sites" on one Docker host:
#   local site  = local-db (primary) + local-app          on networks lan + wan
#   cloud site  = cloud-db (standby) + dbrouter + edge + control + probe on wan
# The "wan" network plays the role of the internet/tailnet between them.
# Cutting the local site from "wan" (scripts/sim.sh cut-local) is the same
# failure the demo shows by unplugging the laptop's network cable.
# Burst instances are containers the control plane creates on "wan".
name: ${SPILLWAY_SIM_PROJECT:-spillway-sim}

# Spillway images are built once by edge / local-db (see scripts/sim.sh up);
# every other Spillway service reuses them.
#
# The web app is not part of Spillway. SPILLWAY_APP_IMAGE is any image that
# follows the app contract (README "앱 계약"); it runs as local-app and as every
# burst instance. `python scripts/deploy_webapp.py --target spillway` builds
# it and writes it to deploy/sim/.env. Default: the examples/guestbook image.
x-app: &app
  image: ${SPILLWAY_SIM_IMAGE:-spillway:latest}
  pull_policy: never
  restart: unless-stopped
  init: true

x-pg: &pg
  image: ${SPILLWAY_SIM_PG_IMAGE:-spillway-pg:latest}
  pull_policy: never
  restart: unless-stopped
  init: true

x-secrets: &secrets
  SPILLWAY_TOKEN: ${SPILLWAY_TOKEN:-}
  REPL_PASSWORD: ${REPL_PASSWORD:-replicator-secret}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-spillway-secret}

services:
  # ------------------------------------------------------------ local site
  local-db:
    <<: *pg
    build: { context: ../.., target: pg }
    environment:
      <<: *secrets
      SITE: local
      ROLE_INIT: primary
    volumes: [local-db:/var/lib/postgresql/data]
    networks: [lan, wan]

  local-app:
    image: ${SPILLWAY_APP_IMAGE:-spillway-guestbook:latest}
    pull_policy: never
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      SITE: local
      INSTANCE: laptop
      DB_URL: postgres://spillway:${APP_DB_PASSWORD:-spillway-secret}@local-db:5432/spillway?sslmode=disable
      # Fixed capacity of the "small on-prem server": 3 concurrent x 25ms work.
      # Guestbook-specific knobs; other apps ignore them.
      WORK_MS: ${WORK_MS:-25}
      MAX_INFLIGHT: ${LOCAL_MAX_INFLIGHT:-3}
    networks: [lan, wan]
    depends_on: [local-db]

  # ------------------------------------------------------------ cloud site
  cloud-db:
    <<: *pg
    environment:
      <<: *secrets
      SITE: cloud
      ROLE_INIT: standby
      PRIMARY_HOST: local-db
    volumes: [cloud-db:/var/lib/postgresql/data]
    networks: [wan]
    depends_on: [local-db]

  dbrouter:
    <<: *app
    command: ["dbrouter"]
    environment:
      SPILLWAY_TOKEN: ${SPILLWAY_TOKEN:-}
      DBROUTER_TARGET: local-db:5432
    networks: [wan]

  edge:
    <<: *app
    build: { context: ../.., target: app }
    command: ["edge"]
    environment:
      SPILLWAY_TOKEN: ${SPILLWAY_TOKEN:-}
      EDGE_BACKENDS: local=http://local-app:8080@local:2
    ports: ["${EDGE_PORT:-8080}:8080"]
    networks: [wan]

  control:
    <<: *app
    command: ["control"]
    user: root # needs the Docker socket to start burst containers
    volumes: ["/var/run/docker.sock:/var/run/docker.sock", "control-data:/data"]
    environment:
      SPILLWAY_TOKEN: ${SPILLWAY_TOKEN:-}
      PUBLIC_URL: http://localhost:${EDGE_PORT:-8080}
      EVENT_LOG: /data/audit.jsonl
      EDGE_ADMIN_URL: http://edge:8081
      DBROUTER_ADMIN_URL: http://dbrouter:7100
      PROBE_URL: http://probe:7200
      LOCAL_AGENT_URL: http://local-db:7000
      CLOUD_AGENT_URL: http://cloud-db:7000
      LOCAL_APP_URL: http://local-app:8080
      # Local server and each burst instance have the same capacity here.
      LOCAL_UNITS: ${LOCAL_UNITS:-1}
      ROUTER_LOCAL_PG: local-db:5432
      ROUTER_CLOUD_PG: cloud-db:5432
      CLOUD_PG_FOR_LOCAL: cloud-db:5432
      LOCAL_PG_FOR_CLOUD: local-db:5432
      CLOUD_PROVIDERS: docker
      DOCKER_PROVIDER_NAME: sim-cloud
      BURST_IMAGE: ${SPILLWAY_APP_IMAGE:-spillway-guestbook:latest}
      BURST_NETWORK: ${SPILLWAY_SIM_PROJECT:-spillway-sim}_wan
      BURST_PREFIX: ${SPILLWAY_SIM_BURST_PREFIX:-spillway-burst}
      BURST_ENV: PORT=8080;SITE=cloud;DB_URL=postgres://spillway:${APP_DB_PASSWORD:-spillway-secret}@dbrouter:6432/spillway?sslmode=disable;WORK_MS=${WORK_MS:-25};MAX_INFLIGHT=${LOCAL_MAX_INFLIGHT:-3}
      BURST_P95_HIGH_MS: ${BURST_P95_HIGH_MS:-250}
      BURST_P95_LOW_MS: ${BURST_P95_LOW_MS:-120}
      BURST_MIN: ${BURST_MIN:-2}
      BURST_MAX: ${BURST_MAX:-6}
      EVAC_MIN: ${EVAC_MIN:-2}
      # Keep N burst instances running at 0% traffic so an evacuation does
      # not wait for instances to start (costs money on a real cloud).
      CLOUD_WARM_MIN: ${CLOUD_WARM_MIN:-0}
    ports: ["${CONTROL_PORT:-8090}:8090"]
    networks: [wan]

  probe:
    <<: *app
    command: ["probe"]
    environment:
      SPILLWAY_TOKEN: ${SPILLWAY_TOKEN:-}
      PROBE_TARGET: http://edge:8080
    networks: [wan]

networks:
  lan: {}
  wan: {}

volumes:
  local-db: {}
  cloud-db: {}
  control-data: {}
